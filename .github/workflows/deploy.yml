# .github/workflows/deploy.yml
# OpenClaw 完整 CI/CD 流水線
# Triggers:
#   - push to main → 全跑 → staging deploy
#   - tag v*.*.* → 全跑 → production deploy

name: CI / CD

on:
  push:
    branches: [main]
    tags:     ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION:    "22"
  REGISTRY:        ghcr.io
  IMAGE_PREFIX:    ${{ github.repository_owner }}/openclaw

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Lint + type check
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }

      - name: Backend lint
        working-directory: openclaw-backend
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint src --max-warnings 0

      - name: Frontend lint
        working-directory: openclaw-console
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint

  # ──────────────────────────────────────────────────────────
  # 2. Unit tests
  # ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - working-directory: openclaw-backend
        run: |
          npm ci
          npm test -- --coverage --testPathPattern="tests/unit"
      - uses: codecov/codecov-action@v4
        with:
          token:   ${{ secrets.CODECOV_TOKEN }}
          flags:   unit

  # ──────────────────────────────────────────────────────────
  # 3. Integration tests (with real DB)
  # ──────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       openclaw_test
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:   postgresql://test:test@localhost:5432/openclaw_test
      JWT_SECRET:     test-jwt-secret-that-is-long-enough
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ANTHROPIC_API_KEY: sk-ant-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - working-directory: openclaw-backend
        run: |
          npm ci
          npx prisma db push --force-reset
          npx prisma db seed
          npm test -- --testPathPattern="tests/integration"

  # ──────────────────────────────────────────────────────────
  # 4. E2E tests (Playwright)
  # ──────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # skip on PR to save time
    needs: [lint, unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openclaw_e2e
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm" }
      - name: Start backend
        working-directory: openclaw-backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/openclaw_e2e
          JWT_SECRET: test-jwt-secret-that-is-long-enough
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          PORT: 4000
        run: |
          npm ci
          npx prisma db push
          npx prisma db seed
          npm run build
          node dist/index.js &
          sleep 5
      - name: E2E tests
        working-directory: openclaw-console
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_API_URL=http://localhost:4000 npx next build
          npx next start &
          sleep 5
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name:           playwright-report
          path:           openclaw-console/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # 5. Security scan
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Audit backend deps
        working-directory: openclaw-backend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Audit frontend deps
        working-directory: openclaw-console
        run: |
          npm ci
          npm audit --audit-level=high
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────────────────
  # 6. Build Docker images
  # ──────────────────────────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push'
    permissions:
      packages: write
    outputs:
      backend-tag:  ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags:   |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context:   openclaw-backend
          push:      true
          tags:      ${{ steps.meta-backend.outputs.tags }}
          labels:    ${{ steps.meta-backend.outputs.labels }}
          cache-from:type=gha
          cache-to:  type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags:   |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context:   openclaw-console
          push:      true
          tags:      ${{ steps.meta-frontend.outputs.tags }}
          labels:    ${{ steps.meta-frontend.outputs.labels }}
          cache-from:type=gha
          cache-to:  type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # 7. Deploy to Staging (main branch)
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url:  ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script:   |
            cd /srv/openclaw
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend
            sleep 10
            curl -f http://localhost:4000/health || exit 1
            echo "Staging deploy OK at $(date)"

  # ──────────────────────────────────────────────────────────
  # 8. Deploy to Production (tag v*.*.*)
  # ──────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, integration-tests, e2e-tests, security]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url:  ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Notify deployment start
        run: |
          echo "::notice::Deploying ${{ github.ref_name }} to production"
      - name: Deploy via SSH (zero-downtime)
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script:   |
            set -e
            cd /srv/openclaw

            # Pull new images
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Run migrations
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="$DATABASE_URL" \
              backend npx prisma migrate deploy

            # Rolling update (backend first, then frontend)
            docker compose -f docker-compose.prod.yml up -d --no-deps \
              --scale backend=2 backend
            sleep 15
            curl -f http://localhost:4000/health || exit 1

            docker compose -f docker-compose.prod.yml up -d --no-deps \
              --scale backend=1 backend frontend

            echo "Production deploy ${{ github.ref_name }} OK at $(date)"

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script:   |
            for i in 1 2 3; do
              curl -sf "${{ vars.PRODUCTION_URL }}/health" && echo "Health check $i OK" && sleep 5
            done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md
