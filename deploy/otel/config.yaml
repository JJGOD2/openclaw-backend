# OpenTelemetry Collector configuration
# Receives traces/metrics from the backend, exports to multiple targets

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout:            5s
    send_batch_size:    512
  memory_limiter:
    check_interval:     1s
    limit_mib:          400
    spike_limit_mib:    100
  resource:
    attributes:
      - key:    environment
        value:  production
        action: upsert

exporters:
  # Prometheus (metrics)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Console debug (disable in production)
  # debug:
  #   verbosity: detailed

  # Grafana Cloud (uncomment and set endpoint)
  # otlphttp/grafana:
  #   endpoint: https://otlp-gateway-prod-xx.grafana.net/otlp
  #   headers:
  #     authorization: Basic ${GRAFANA_OTLP_TOKEN}

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [debug]

    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [prometheus]
