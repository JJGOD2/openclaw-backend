global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: openclaw-backend
    static_configs:
      - targets: ["backend:4000"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer:9127"]   # pgbouncer_exporter

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]   # redis_exporter
