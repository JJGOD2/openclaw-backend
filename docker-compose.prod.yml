# docker-compose.prod.yml
# 生產環境 Docker Compose
# 包含：PostgreSQL + PgBouncer + Redis + Nginx + OpenClaw Backend + Frontend + Grafana

version: "3.9"

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB:       openclaw
      POSTGRES_USER:     ${POSTGRES_USER:-openclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openclaw}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [internal]
    # Do NOT expose port 5432 to host in production

  # ── PgBouncer — Connection Pooling ──────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1.22.1
    <<: [*restart, *logging]
    environment:
      POSTGRESQL_HOST:        postgres
      POSTGRESQL_PORT:        5432
      POSTGRESQL_DATABASE:    openclaw
      POSTGRESQL_USERNAME:    ${POSTGRES_USER:-openclaw}
      POSTGRESQL_PASSWORD:    ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE:    transaction         # best for web apps
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 25             # 25 server connections per db/user
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 5
      PGBOUNCER_AUTH_TYPE:    scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redisdata:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  3s
      retries:  5
    networks: [internal]

  # ── OpenClaw Backend ─────────────────────────────────────────
  backend:
    build:
      context:    ./openclaw-backend
      dockerfile: Dockerfile
      target:     production
    <<: [*restart, *logging]
    environment:
      NODE_ENV:         production
      PORT:             4000
      DATABASE_URL:     postgresql://${POSTGRES_USER:-openclaw}:${POSTGRES_PASSWORD}@pgbouncer:5432/openclaw
      REDIS_URL:        redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:       ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_KEY:   ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      FRONTEND_URL:     ${FRONTEND_URL}
      BACKEND_URL:      ${BACKEND_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      pgbouncer: { condition: service_started }
      redis:     { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus:   "1.0"

  # ── OpenClaw Frontend ────────────────────────────────────────
  frontend:
    build:
      context:    ./openclaw-console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    <<: [*restart, *logging]
    environment:
      NODE_ENV:              production
      NEXT_PUBLIC_API_URL:   ${BACKEND_URL}
    depends_on: [backend]
    networks: [internal, external]
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Nginx — TLS termination + reverse proxy ──────────────────
  nginx:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    depends_on: [backend, frontend]
    networks: [internal, external]

  # ── OpenTelemetry Collector ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    <<: [*restart, *logging]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel/config.yaml:/etc/otel/config.yaml:ro
    networks: [internal]

  # ── Grafana (optional monitoring UI) ────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "${GRAFANA_URL:-http://localhost:3001}"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"   # exposed only if GRAFANA_EXPOSE=true
    networks: [internal]
    profiles: ["monitoring"]   # opt-in: docker compose --profile monitoring up

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    <<: [*restart, *logging]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [internal]
    profiles: ["monitoring"]

volumes:
  pgdata:
  redisdata:
  grafanadata:
  prometheusdata:
  nginx_cache:

networks:
  internal:
    driver: bridge
    internal: true      # no direct internet access
  external:
    driver: bridge
